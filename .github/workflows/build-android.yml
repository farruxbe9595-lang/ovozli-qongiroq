name: Build Android test APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoiceCallPrototype/**'
      - '.github/workflows/build-android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: VoiceCallPrototype
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ovoz-sinovi-debug-apk
          path: VoiceCallPrototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
